name: Test & Build

on:
 pull_request:
 branches: [main]
push:   
    branches: [main]
    
 jobs:
 test-build:
 runs-on: ubuntu-latest
 steps:
    - uses: action/checkout@4
 
 - uses: actions/setupnode@4
   with:
      node-version: 22
      cache:npm

      - run: npm ci

      - name: Unit tests
        run: npm run test

        - name: Build
        run: npm run build
        env:
        AUTH_SECRET : ci-placeholder-secret
